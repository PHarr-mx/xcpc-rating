[project]
name = "xcpc-rating"
version = "0.1.0"
description = "校内 XCPC 系列编程竞赛的 Rating 统计与展示系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
web = [
    "reflex==0.9.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
xcpc-player = "xcpc_core.player.cli:main"
xcpc-team = "xcpc_core.team.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xcpc_core"]

[tool.pytest.ini_options]
testpaths = ["xcpc_core"]
